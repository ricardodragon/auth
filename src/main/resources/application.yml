server:
  port: 5000

spring:
  application:
    name: auth
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:mysql://127.0.0.1:3306/dibros?allowPublicKeyRetrieval=true&sslMode=DISABLED&useTimezone=true&serverTimezone=UTC}
    username: ${SPRING_R2DBC_USERNAME:root}
    password: ${SPRING_R2DBC_PASSWORD:root}
  jmx:
    enabled: false
  jackson:
    default-property-inclusion: non_null

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 25
  client:
    service-url:
      defaultZone: http://localhost:7081/eureka/

jwt:
  config:
    type: signed
    private-key: ${JWT_SECRET}

email:
  token: ${TOKEN}
  endereco: ricardoelfuego@gmail.com

